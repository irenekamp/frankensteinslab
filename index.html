<!DOCTYPE html>
<html lang="nl">
	
<head>
	<meta charset="UTF-8">
	<meta name="author" content="Irene">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Frankenstein's Lab</title>

	<link href="styles/style.css" rel="stylesheet">

	<link rel="icon" type="image/svg+xml" href="images/favicon.svg">

	<style>
    	@import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap');
  	</style>

</head>

<body>

  <input type="radio" name="ogen" id="ogen-open" hidden>
  <input type="radio" name="ogen" id="ogen-dicht" hidden>
  <input type="radio" name="ogen" id="ogen-genaaid" hidden> 

  <div class="lab">

    <h1 class="lab__titel"> Frankenstein's Lab
      <span>// bouw je eigen monster //</span>
    </h1>

    <div class="lab__inhoud">

      <section class="operatietafel" aria-label="Operatietafel">
        <p class="operatietafel_label">— operatietafel —</p>

        <div class="hoofd" aria-label="Blanco gezicht">
          <div class="zone zone--ogen">
            <span class="zone_label"></span>
              <div class="ogen">
                <div class="oog"></div>
                <div class="oog"></div>
              </div>
          </div>

          <div class="zone zone--neus">
            <span class="zone_label">neus</span>
          </div>

          <div class="zone zone--mond">
            <span class="zone_label">mond</span>
          </div>
        </div>

      </section>

      <aside class="voorraadkast" aria-label="Voorraadkast">
        <h2 class="voorraadkast_titel">Voorraadkast</h2>
        <div class="categorie">
          <p class="categorie_naam">— ogen —</p>
          <div class="categorie_potjes">
            <label class="potje potje--ogen-open" for="ogen-open"> 
              <span class="potje_preview">
                <span class="preview-oog-open"></span>
              </span>
              <span class="potje_naam">open</span>
             </label>
            
            <label class="potje potje--ogen-dicht" for="ogen-dicht"> 
              <span class="potje_preview">
                <span class="preview-oog-dicht"></span>
              </span>
              <span class="potje_naam">dicht</span> 
            </label>

            <label class="potje potje--ogen-genaaid" for="ogen-genaaid"> 
              <span class="potje_preview">
                <span class="preview-oog-genaaid"></span>
              </span>
              <span class="potje_naam">genaaid</span> 
            </label>

          </div>
        </div>
      </aside>

    </div>
  </div>

</body>
</html>
